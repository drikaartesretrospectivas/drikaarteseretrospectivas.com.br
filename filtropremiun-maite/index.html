<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Maitê 1 Aninho - Instamomentos</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

    <style>
        :root { --cor-fundo: #121212; --cor-texto: #ffffff; --cor-destaque: #d1a2b1; --cor-secundaria: #8E8E8E; --card-bg: #1e1e1e; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--cor-fundo); color: var(--cor-texto); min-height: 100dvh; display: flex; flex-direction: column; }
        
        /* Cabeçalho perfeito ponta a ponta sem cortes */
        .event-header { width: 100%; background-color: #000; overflow: hidden; }
        .event-header img { width: 100%; height: 180px; display: block; object-fit: cover; }
        .event-info { text-align: center; padding: 12px; background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, rgba(18,18,18,1) 100%); }
        .event-info h1 { font-size: 1.3rem; color: var(--cor-destaque); margin-bottom: 3px; font-weight: bold; }
        .event-info p { font-size: 0.8rem; color: #aaa; }

        /* Abas de Navegação Superiores */
        .nav-tabs { display: flex; background-color: var(--card-bg); border-bottom: 2px solid #333; }
        .tab-btn { flex: 1; padding: 12px 6px; background: none; border: none; color: #888; font-weight: bold; font-size: 0.8rem; cursor: pointer; text-align: center; transition: 0.3s; white-space: nowrap; }
        .tab-btn.active { color: var(--cor-destaque); border-bottom: 3px solid var(--cor-destaque); background-color: rgba(255, 51, 102, 0.05); }

        .container-conteudo { padding: 15px; max-width: 600px; margin: 0 auto; width: 100%; flex: 1; }
        .section-tab { display: none; }
        .section-tab.active { display: block; }

        /* Card de Captura */
        .capture-box { background: var(--card-bg); padding: 20px; border-radius: 12px; text-align: center; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .capture-box h3 { margin-bottom: 5px; font-size: 1.1rem; }
        .options-group { margin: 15px 0; display: flex; justify-content: center; gap: 15px; font-size: 0.9rem; color: #ccc; }
        .btn-acao { background-color: var(--cor-destaque); color: white; border: none; padding: 12px 20px; border-radius: 30px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; font-size: 0.95rem; box-shadow: 0 4px 12px rgba(255, 51, 102, 0.3); }
        .btn-secundario { background-color: #333; color: #fff; box-shadow: none; }

        /* Feeds de Fotos e Vídeos */
        .feed-grid { display: flex; flex-direction: column; gap: 20px; }
        .feed-card { background: var(--card-bg); border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .media-container { position: relative; width: 100%; background: #000; display: flex; justify-content: center; align-items: center; }
        .media-container img, .media-container video { width: 100%; max-height: 450px; display: block; object-fit: contain; }
        .feed-actions { padding: 12px; display: flex; align-items: center; gap: 15px; }
        .like-btn { background: none; border: none; font-size: 1.3rem; cursor: pointer; color: #fff; display: flex; align-items: center; gap: 5px; }
        .comment-count-btn { background: none; border: none; font-size: 1.3rem; cursor: pointer; color: #fff; display: flex; align-items: center; gap: 5px; }

        /* Interface da Câmera Nativa com Zoom isolado no fundo */
        .camera-container { position: fixed; inset: 0; height: 100dvh; background-color: #000; z-index: 1000; display: none; overflow: hidden; touch-action: none; }
        .video-wrapper { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        #videoElement { width: 100%; height: 100%; object-fit: cover; transform-origin: center center; transition: transform 0.05s linear; }
        #molduraOverlay { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; z-index: 2; }
        
        .flash-effect { position: absolute; inset: 0; background: #fff; z-index: 99; opacity: 0; pointer-events: none; transition: opacity 0.15s ease-out; }

        .camera-header { position: absolute; top: 0; width: 100%; padding: 20px; z-index: 10; background: linear-gradient(to bottom, rgba(0,0,0,0.5), transparent); }
        .btn-fechar { background: rgba(0,0,0,0.6); color: #fff; border: 1px solid rgba(255,255,255,0.3); padding: 8px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        .camera-controles { position: absolute; bottom: 0; width: 100%; padding: 40px 20px; z-index: 10; background: linear-gradient(to top, rgba(0,0,0,0.8), transparent); display: flex; flex-direction: column; gap: 20px; }
        .filtros { display: flex; gap: 10px; justify-content: center; }
        .btn-filtro { background-color: rgba(255,255,255,0.2); color: #fff; border: 1px solid rgba(255,255,255,0.4); padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; }
        .btn-filtro.ativo { background-color: var(--cor-destaque); border-color: var(--cor-destaque); }
        .acoes-principais { display: flex; justify-content: space-around; align-items: center; }
        .btn-acao-camera { background: none; border: none; color: #fff; font-size: 1.3rem; cursor: pointer; display: flex; flex-direction: column; align-items: center; width: 60px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .btn-acao-camera span { font-size: 0.65rem; color: #fff; margin-top: 4px; font-weight: bold; }
        .btn-capturar-final { width: 75px; height: 75px; border-radius: 50%; background-color: #fff; border: 5px solid rgba(255,255,255,0.3); cursor: pointer; transition: transform 0.1s; }
        .btn-capturar-final:active { transform: scale(0.9); }

        /* MODO TELÃO (SLIDESHOW) */
        #telaoModal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 9999; display: none; flex-direction: column; }
        .telao-topbar { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 20px 30px; background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, transparent 100%); z-index: 10000; }
        .telao-topbar h2 { color: var(--cor-destaque); font-size: 1.4rem; text-shadow: 0 2px 5px rgba(0,0,0,0.8); }
        .close-telao { background: var(--cor-destaque); color: #fff; border: none; padding: 8px 16px; font-size: 0.9rem; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .telao-body { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; }

        /* Modal Expandir Mídia e Comentários */
        .modal-foto { position: fixed; inset: 0; background-color: rgba(0,0,0,0.95); z-index: 2000; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 15px; }
        .btn-fechar-modal { position: absolute; top: 25px; left: 20px; background: none; border: none; color: #fff; font-size: 1.1rem; cursor: pointer; z-index: 2010; font-weight: bold; }
        .modal-media-wrapper { width: 100%; display: flex; justify-content: center; align-items: center; max-height: 42vh; margin-bottom: 8px; }
        .modal-media-wrapper img, .modal-media-wrapper video { max-width: 90%; max-height: 42vh; object-fit: contain; border-radius: 8px; }
        .modal-acoes { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 10px; }
        .btn-acao-modal { background-color:#333; color:white; padding:8px 14px; border-radius:25px; border:none; font-weight:bold; cursor: pointer; font-size: 0.8rem; }

        /* Caixa de Comentários no Modal (Organizada em 2 Linhas) */
        .modal-comentarios-container { width: 100%; max-width: 450px; background: #1a1a1a; border-radius: 12px; padding: 10px; display: flex; flex-direction: column; max-height: 38vh; border: 1px solid #333; }
        .modal-comentarios-lista { flex: 1; overflow-y: auto; list-style: none; padding-right: 5px; margin-bottom: 8px; }
        .comentario-item { font-size: 0.85rem; color: #ccc; margin-bottom: 6px; border-bottom: 1px dashed #333; padding-bottom: 4px; text-align: left; }
        
        .comentario-form { display: flex; flex-direction: column; gap: 6px; width: 100%; }
        .comentario-form input#inputNomeConvidado { width: 100%; background: #2a2a2a; border: 1px solid #444; padding: 8px 12px; border-radius: 20px; color: #fff; font-size: 0.85rem; outline: none; }
        .comentario-linha-inferior { display: flex; gap: 6px; width: 100%; }
        .comentario-linha-inferior input#inputTextoComentario { flex: 1; min-width: 0; background: #2a2a2a; border: 1px solid #444; padding: 8px 12px; border-radius: 20px; color: #fff; font-size: 0.85rem; outline: none; }
        .comentario-linha-inferior button#btnEnviarComentarioModal { background: var(--cor-destaque); border: none; color: #fff; padding: 8px 16px; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 0.85rem; flex: 0 0 auto; }

        .file-input-hidden { display: none; }
    </style>
</head>
<body>

    <!-- Cabeçalho com Banner Proporcional -->
    <header class="event-header">
        <img src="https://res.cloudinary.com/dlbft9sjz/image/upload/v1785021047/Banner_maite_vxsvdt.png" alt="Capa do Evento">
    </header>
    <div class="event-info">
        <h1>Maitê 1 Aninho</h1>
        <p>31 de dezembro de 2026</p>
    </div>

    <!-- Navegação por Abas -->
    <nav class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('capture')">📸 Câmera</button>
        <button class="tab-btn" onclick="switchTab('photosFeed')">🖼️ Fotos</button>
        <button class="tab-btn" onclick="switchTab('videosFeed')">🎥 Vídeos</button>
        <button class="tab-btn" onclick="openTelao()" style="color: #4285F4;">🖥️ Telão</button>
    </nav>

    <div class="container-conteudo">

        <!-- ABA CAPTURA -->
        <div id="capture" class="section-tab active">
            <div class="capture-box">
                <h3>Compartilhe seu Momento</h3>
                <p style="font-size: 0.8rem; color: #aaa; margin-bottom: 10px;">Vídeos aceitam até 30s em 1080p Full HD.</p>

                <div class="options-group">
                    <label><input type="radio" name="frameMode" value="withFrame" checked> Com Moldura</label>
                    <label><input type="radio" name="frameMode" value="noFrame"> Sem Moldura</label>
                </div>

                <button class="btn-acao" onclick="openCamera('photo')">Tirar Foto (Câmera)</button>
                <button class="btn-acao" onclick="openCamera('video')">Gravar Vídeo (Até 30s)</button>
                <button class="btn-acao btn-secundario" onclick="document.getElementById('galleryInput').click()">Enviar da Galeria</button>
                <input type="file" id="galleryInput" class="file-input-hidden" accept="image/*" onchange="handleGalleryUpload(event)">
            </div>
        </div>

        <!-- ABA FEED FOTOS -->
        <div id="photosFeed" class="section-tab">
            <div class="feed-grid" id="photoGridContainer"></div>
        </div>

        <!-- ABA FEED VÍDEOS -->
        <div id="videosFeed" class="section-tab">
            <div class="feed-grid" id="videoGridContainer"></div>
        </div>

    </div>

    <!-- MODO TELÃO (SLIDESHOW) -->
    <div id="telaoModal">
        <div class="telao-topbar">
            <h2>Maitê 1 Aninho - Ao Vivo</h2>
            <button class="close-telao" onclick="closeTelao()">Fechar Telão</button>
        </div>
        <div class="telao-body" id="telaoMediaContainer"></div>
    </div>

    <!-- INTERFACE DA CÂMERA -->
    <div id="cameraContainer" class="camera-container">
        <div class="flash-effect" id="flashEffect"></div>
        <div class="camera-header">
            <button id="btnFecharCamera" class="btn-fechar">❌ Voltar</button>
        </div>
        <div class="video-wrapper" id="videoWrapper">
            <video id="videoElement" autoplay playsinline></video>
            <img id="molduraOverlay" src="https://res.cloudinary.com/dlbft9sjz/image/upload/v1785019951/moldura1_svyu3n.png" crossorigin="anonymous" alt="Moldura">
        </div>
        <div class="camera-controles">
            <div class="filtros">
                <button id="btnFiltroNormal" class="btn-filtro ativo">Normal</button>
                <button id="btnFiltroPB" class="btn-filtro">P&B</button>
            </div>
            <div class="acoes-principais">
                <button id="btnUploadFoto" class="btn-acao-camera">🖼️<span>Galeria</span></button>
                <input type="file" id="inputUploadArquivo" class="file-input-hidden" accept="image/*" onchange="handleGalleryUpload(event)">
                <button id="btnFlash" class="btn-acao-camera">⚡<span>Flash</span></button>
                <button id="btnCapturarFinal" class="btn-capturar-final"></button>
                <button id="btnVideoLink" class="btn-acao-camera" style="color: #FFD700;">🎬<span>Vídeo</span></button>
                <button id="btnInverterCamera" class="btn-acao-camera">🔄<span>Trocar</span></button>
            </div>
        </div>
    </div>

    <!-- MODAL DE ESTÚDIO / CORTE PARA GALERIA -->
    <div id="modalEstudio" class="modal-foto" style="z-index: 3000;">
        <h3 style="color: white; margin-bottom: 10px;">Ajuste sua foto com o toque</h3>
        <div style="width: 90%; max-width: 350px; aspect-ratio: 9 / 16; background-color: #000; overflow: hidden; border-radius: 12px; position: relative;">
            <img id="imagemParaCortar" src="" style="display: block; max-width: 100%;">
            <img id="molduraEstudio" src="https://res.cloudinary.com/dlbft9sjz/image/upload/v1785019951/moldura1_svyu3n.png" crossorigin="anonymous" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; z-index: 3010;">
        </div>
        <div class="modal-acoes" style="margin-top: 15px;">
            <button id="btnCancelarCorte" class="btn-acao-modal" style="background-color:#ff4444;">❌ Cancelar</button>
            <button id="btnConfirmarCorte" class="btn-acao-modal" style="background-color:var(--cor-destaque);">✅ Enviar Foto</button>
        </div>
    </div>

    <!-- MODAL DE VISUALIZAÇÃO DE FOTO/VÍDEO E COMENTÁRIOS -->
    <div id="modalFoto" class="modal-foto">
        <button onclick="window.fecharModal()" class="btn-fechar-modal">❌ Voltar</button>
        <div class="modal-media-wrapper" id="modalMediaWrapper"></div>
        <div class="modal-acoes">
            <button id="btnModalCurtir" class="btn-acao-modal">❤️ <span id="contadorModalCurtidas">0</span></button>
            <a id="btnModalBaixar" class="btn-acao-modal" href="#" style="text-decoration:none; display:flex; align-items:center;">⬇️ Baixar</a>
            <button id="btnModalDeletar" class="btn-acao-modal" style="background-color:#441111;">🗑️ Excluir</button>
        </div>
        <div class="modal-comentarios-container">
            <ul id="listaComentariosModal" class="modal-comentarios-lista"></ul>
            <div class="comentario-form">
                <input type="text" id="inputNomeConvidado" placeholder="Seu Nome">
                <div class="comentario-linha-inferior">
                    <input type="text" id="inputTextoComentario" placeholder="Escreva um comentário...">
                    <button id="btnEnviarComentarioModal">Enviar</button>
                </div>
            </div>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, query, orderBy, doc, updateDoc, deleteDoc, increment, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBwFX2u8r_mCX_sDPGbi7OH3Xr3nhUSWXA",
        projectId: "insta-momentos-drive-7a133",
        appId: "1:304775159960:web:e95737d05dc05cfc2f30ed"
    };
    
    const IMGBB_API_KEY = "aa0c9dc6122e459a16cf1f6e8d9d3686";
    const CLOUD_NAME = "dlbft9sjz";
    const UPLOAD_PRESET = "instamomentos_videos";
    const EVENTO_ID = "festa_maite";
    const DRIVE_EMAIL = "instamomentosdrika@gmail.com"; 
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzhT2bxvcebAhxkahCsdVoW2RAw87CmoazLi6vdey6-KMj36mvrXq0IB72gtD9jHbz_Eg/exec";
    const LINK_VIDEO_EXTERNO = "https://drikaarteseretrospectivas.com.br/instamomentos-maite/";
    const MOLDURA_URL = "https://res.cloudinary.com/dlbft9sjz/image/upload/v1785019951/moldura1_svyu3n.png";
    const ADMIN_SENHA_HASH = "fe2592b42a727e977f055947385b709cc82b16b9a87f88c6abf3900d65d0cdc3";

    let appData = { photos: [], videos: [] };
    let cropper = null;
    let torchOn = false;
    let currentZoom = 1;

    try {
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const videoElement = document.getElementById('videoElement');
        const cameraContainer = document.getElementById('cameraContainer');
        const molduraOverlay = document.getElementById('molduraOverlay');
        const flashEffect = document.getElementById('flashEffect');
        const videoWrapper = document.getElementById('videoWrapper');
        let stream = null;
        let usandocameraFrontal = false;

        function playCameraShutterSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(900, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } catch(e) {}
        }

        let initialDist = 0;
        videoWrapper.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                initialDist = Math.hypot(
                    e.touches[0].pageX - e.touches[1].pageX,
                    e.touches[0].pageY - e.touches[1].pageY
                );
            }
        });

        videoWrapper.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2 && initialDist > 0) {
                const dist = Math.hypot(
                    e.touches[0].pageX - e.touches[1].pageX,
                    e.touches[0].pageY - e.touches[1].pageY
                );
                let zoomFactor = currentZoom * (dist / initialDist);
                zoomFactor = Math.max(1, Math.min(zoomFactor, 4));
                currentZoom = zoomFactor;
                videoElement.style.transform = `scale(${currentZoom})`;
            }
        });

        videoWrapper.addEventListener('touchend', (e) => {
            if (e.touches.length < 2) initialDist = 0;
        });

        window.switchTab = function(tabId) {
            document.querySelectorAll('.section-tab').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            event?.currentTarget?.classList?.add('active');

            if(tabId === 'photosFeed') renderPhotos();
            if(tabId === 'videosFeed') renderVideos();
        }

        window.openCamera = async (type) => {
            if(type === 'photo') {
                cameraContainer.style.display = 'block';
                const useFrame = document.querySelector('input[name="frameMode"]:checked')?.value === 'withFrame';
                molduraOverlay.style.display = useFrame ? 'block' : 'none';
                currentZoom = 1;
                videoElement.style.transform = 'scale(1)';
                startStream();
            } else {
                const inputVid = document.createElement('input');
                inputVid.type = 'file';
                inputVid.accept = 'video/*';
                inputVid.capture = 'environment';
                inputVid.onchange = async (e) => {
                    const file = e.target.files[0];
                    if(!file) return;
                    alert("Enviando vídeo com estabilidade máxima...");
                    await enviarVideoServidores(file);
                };
                inputVid.click();
            }
        };

        document.querySelectorAll('input[name="frameMode"]').forEach(radio => {
            radio.onchange = (e) => {
                const useFrame = e.target.value === 'withFrame';
                molduraOverlay.style.display = useFrame ? 'block' : 'none';
            };
        });

        async function startStream() {
            const modo = usandocameraFrontal ? "user" : "environment";
            torchOn = false;
            document.getElementById('btnFlash').style.color = '#fff';
            try {
                if (stream) stream.getTracks().forEach(t => t.stop());
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: modo }, audio: false });
                videoElement.srcObject = stream;
            } catch (err) { alert("Erro ao acessar câmera do celular"); fecharInterface(); }
        }

        function fecharInterface() {
            if (stream) stream.getTracks().forEach(t => t.stop());
            cameraContainer.style.display = 'none';
        }

        document.getElementById('btnFecharCamera').onclick = fecharInterface;
        document.getElementById('btnInverterCamera').onclick = () => { usandocameraFrontal = !usandocameraFrontal; startStream(); };

        document.getElementById('btnFlash').onclick = async () => {
            if (!stream) { alert("A câmera não está ativa."); return; }
            const track = stream.getVideoTracks()[0];
            const capabilities = track.getCapabilities ? track.getCapabilities() : {};
            if (!capabilities.torch) { alert("O flash não é suportado por este dispositivo."); return; }
            torchOn = !torchOn;
            try {
                await track.applyConstraints({ advanced: [{ torch: torchOn }] });
                document.getElementById('btnFlash').style.color = torchOn ? '#FFD700' : '#fff';
            } catch (err) { alert("Não foi possível ativar o flash."); }
        };

        document.getElementById('btnFiltroNormal').onclick = () => {
            videoElement.style.filter = "none";
            document.getElementById('btnFiltroNormal').classList.add('ativo');
            document.getElementById('btnFiltroPB').classList.remove('ativo');
        };
        
        document.getElementById('btnFiltroPB').onclick = () => {
            videoElement.style.filter = "grayscale(100%)";
            document.getElementById('btnFiltroPB').classList.add('ativo');
            document.getElementById('btnFiltroNormal').classList.remove('ativo');
        };

        onSnapshot(query(collection(db, "eventos/" + EVENTO_ID + "/postagens"), orderBy("data_envio", "desc")), (snap) => {
            appData.photos = [];
            appData.videos = [];

            snap.forEach(docSnap => {
                const p = docSnap.data();
                const item = { 
                    id: docSnap.id, 
                    url: p.url_imagem, 
                    tipo: p.tipo || 'foto',
                    likes: p.curtidas || 0, 
                    comments: p.total_comentarios || 0 
                };
                if(p.tipo === 'video') {
                    appData.videos.push(item);
                } else {
                    appData.photos.push(item);
                }
            });
            renderPhotos();
            renderVideos();
        });

        async function enviarMidiaServidores(base64Data, tipo = 'foto') {
            const form = new FormData(); 
            form.append('image', base64Data);
            const resImg = await fetch("https://api.imgbb.com/1/upload?key=" + IMGBB_API_KEY, { method: 'POST', body: form });
            const imgData = await resImg.json();
            
            if (imgData.success) {
               await addDoc(collection(db, "eventos/" + EVENTO_ID + "/postagens"), { 
                   url_imagem: imgData.data.url, 
                   tipo: tipo,
                   curtidas: 0, 
                   total_comentarios: 0,
                   data_envio: serverTimestamp() 
               });
            }

            if (SCRIPT_URL && SCRIPT_URL.includes("script.google.com")) {
                try {
                    await fetch(SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            base64: "data:image/jpeg;base64," + base64Data,
                            filename: "Instamomento_" + Date.now() + ".jpg"
                        })
                    });
                } catch(err) { console.error("Erro Apps Script Drive:", err); }
            }
        }

        async function enviarVideoServidores(file) {
            let videoUrl = "";
            if (CLOUD_NAME && UPLOAD_PRESET) {
                const formData = new FormData();
                formData.append('file', file);
                formData.append('upload_preset', UPLOAD_PRESET);
                try {
                    const resCloud = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/upload`, {
                        method: 'POST',
                        body: formData
                    });
                    const cloudData = await resCloud.json();
                    if (cloudData.secure_url) {
                        videoUrl = cloudData.secure_url;
                    }
                } catch (err) {
                    console.error("Erro Cloudinary Vídeo:", err);
                }
            }

            if (!videoUrl) {
                videoUrl = URL.createObjectURL(file);
            }

            if (SCRIPT_URL && SCRIPT_URL.includes("script.google.com")) {
                const reader = new FileReader();
                reader.onload = async (ev) => {
                    try {
                        await fetch(SCRIPT_URL, {
                            method: 'POST',
                            mode: 'no-cors',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                base64: ev.target.result,
                                filename: "Instamomento_Video_" + Date.now() + ".mp4"
                            })
                        });
                    } catch(err) { console.error("Erro Vídeo Drive:", err); }
                };
                reader.readAsDataURL(file);
            }

            await addDoc(collection(db, "eventos/" + EVENTO_ID + "/postagens"), { 
                url_imagem: videoUrl, 
                tipo: 'video',
                curtidas: 0, 
                total_comentarios: 0,
                data_envio: serverTimestamp() 
            });
            switchTab('videosFeed');
        }

        document.getElementById('btnCapturarFinal').onclick = async () => {
            const btnCap = document.getElementById('btnCapturarFinal');
            btnCap.style.pointerEvents = 'none';

            playCameraShutterSound();
            flashEffect.style.opacity = '1';
            setTimeout(() => { flashEffect.style.opacity = '0'; }, 150);

            const useFrame = document.querySelector('input[name="frameMode"]:checked')?.value === 'withFrame';
            const canvas = document.createElement('canvas');
            canvas.width = 1080; canvas.height = 1920;
            const ctx = canvas.getContext('2d');
            
            if (document.getElementById('btnFiltroPB').classList.contains('ativo')) ctx.filter = 'grayscale(100%)';
            if (usandocameraFrontal) { ctx.translate(canvas.width, 0); ctx.scale(-1, 1); }
            
            const vWidth = videoElement.videoWidth || 1080;
            const vHeight = videoElement.videoHeight || 1920;
            const zW = vWidth / currentZoom;
            const zH = vHeight / currentZoom;
            const sX = (vWidth - zW) / 2;
            const sY = (vHeight - zH) / 2;

            ctx.drawImage(videoElement, sX, sY, zW, zH, 0, 0, canvas.width, canvas.height);
            ctx.filter = 'none'; ctx.setTransform(1,0,0,1,0,0);
            
            if (useFrame && molduraOverlay.complete && molduraOverlay.naturalWidth > 0) {
                ctx.drawImage(molduraOverlay, 0, 0, canvas.width, canvas.height);
            }

            const base64 = canvas.toDataURL('image/jpeg', 0.85).split(',')[1];
            await enviarMidiaServidores(base64, 'foto');
            
            btnCap.style.pointerEvents = 'auto';
            fecharInterface();
            switchTab('photosFeed');
        };

        document.getElementById('btnUploadFoto').onclick = () => {
            document.getElementById('inputUploadArquivo').click();
        };

        window.handleGalleryUpload = (event) => {
            const file = event.target.files[0];
            if (!file) return;
            if (cropper) { cropper.destroy(); cropper = null; }
            const reader = new FileReader();
            reader.onload = (e) => {
                const imagem = document.getElementById('imagemParaCortar');
                const useFrame = document.querySelector('input[name="frameMode"]:checked')?.value === 'withFrame';
                document.getElementById('molduraEstudio').style.display = useFrame ? 'block' : 'none';
                document.getElementById('modalEstudio').style.display = 'flex';
                imagem.src = e.target.result;
                imagem.onload = () => {
                    setTimeout(() => {
                        cropper = new Cropper(imagem, {
                            aspectRatio: 9 / 16, viewMode: 1, dragMode: 'move', autoCropArea: 1, background: false, guides: false, center: false, highlight: false, cropBoxMovable: false, cropBoxResizable: false,
                            ready() { this.cropper.setCropBoxData({ left: 0, top: 0, width: this.cropper.getContainerData().width, height: this.cropper.getContainerData().height }); }
                        });
                    }, 200);
                };
            };
            reader.readAsDataURL(file);
        };

        document.getElementById('btnCancelarCorte').onclick = () => {
            document.getElementById('modalEstudio').style.display = 'none';
            if (cropper) cropper.destroy();
        };

        document.getElementById('btnConfirmarCorte').onclick = async () => {
            const btn = document.getElementById('btnConfirmarCorte');
            btn.innerHTML = "⏳ Enviando...";
            btn.disabled = true;
            try {
                const useFrame = document.querySelector('input[name="frameMode"]:checked')?.value === 'withFrame';
                const canvas = cropper.getCroppedCanvas({ width: 1080, height: 1920 });
                const ctx = canvas.getContext('2d');
                
                const molduraEstudio = document.getElementById('molduraEstudio');
                if (useFrame && molduraEstudio.complete && molduraEstudio.naturalWidth > 0) {
                    ctx.drawImage(molduraEstudio, 0, 0, canvas.width, canvas.height);
                }
                
                const base64 = canvas.toDataURL('image/jpeg', 0.85).split(',')[1];
                await enviarMidiaServidores(base64, 'foto');
                document.getElementById('modalEstudio').style.display = 'none';
                if (cropper) cropper.destroy();
                fecharInterface();
                switchTab('photosFeed');
            } catch(e) {
                alert("Erro ao enviar foto da galeria: " + e.message);
            } finally {
                btn.innerHTML = "✅ Enviar Foto";
                btn.disabled = false;
            }
        };

        window.renderPhotos = function() {
            const container = document.getElementById('photoGridContainer');
            if(appData.photos.length === 0) {
                container.innerHTML = "<p style='text-align:center; color:#888; padding:30px;'>Nenhuma foto enviada ainda.</p>";
                return;
            }
            container.innerHTML = appData.photos.map(item => `
                <div class="feed-card">
                    <div class="media-container" style="cursor: pointer;" onclick="abrirModal('${item.url}', '${item.id}', ${item.likes}, 'foto')">
                        <img src="${item.url}" alt="Foto">
                    </div>
                    <div class="feed-actions">
                        <button class="like-btn" onclick="toggleLike('${item.id}')">❤️ ${item.likes}</button>
                        <button class="comment-count-btn" onclick="abrirModal('${item.url}', '${item.id}', ${item.likes}, 'foto')">💬 ${item.comments}</button>
                    </div>
                </div>
            `).join('');
        }

        window.renderVideos = function() {
            const container = document.getElementById('videoGridContainer');
            if(appData.videos.length === 0) {
                container.innerHTML = "<p style='text-align:center; color:#888; padding:30px;'>Nenhum vídeo enviado ainda.</p>";
                return;
            }
            container.innerHTML = appData.videos.map(item => `
                <div class="feed-card">
                    <div class="media-container">
                        <video src="${item.url}" controls playsinline preload="metadata" style="cursor:pointer;" onclick="abrirModal('${item.url}', '${item.id}', ${item.likes}, 'video')"></video>
                    </div>
                    <div class="feed-actions">
                        <button class="like-btn" onclick="toggleLike('${item.id}')">❤️ ${item.likes}</button>
                        <button class="comment-count-btn" onclick="abrirModal('${item.url}', '${item.id}', ${item.likes}, 'video')">💬 ${item.comments} (comentário)</button>
                    </div>
                </div>
            `).join('');
        }

        window.abrirModal = (url, id, likes, tipo) => {
            const mediaWrapper = document.getElementById('modalMediaWrapper');
            if (tipo === 'video') {
                mediaWrapper.innerHTML = `<video src="${url}" controls autoplay playsinline style="max-width:90%; max-height:42vh; object-fit:contain; border-radius:8px;"></video>`;
            } else {
                mediaWrapper.innerHTML = `<img src="${url}" style="max-width:90%; max-height:42vh; object-fit:contain; border-radius:8px;">`;
            }

            document.getElementById('contadorModalCurtidas').textContent = likes;
            
            document.getElementById('btnModalCurtir').onclick = () => {
                updateDoc(doc(db, "eventos/" + EVENTO_ID + "/postagens", id), { curtidas: increment(1) });
            };

            document.getElementById('btnModalDeletar').onclick = async () => {
                const senhaDigitada = prompt("Senha Admin:");
                if (!senhaDigitada) return;

                const msgBuffer = new TextEncoder().encode(senhaDigitada);
                const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

                if (hashHex === ADMIN_SENHA_HASH) {
                    deleteDoc(doc(db, "eventos/" + EVENTO_ID + "/postagens", id));
                    window.fecharModal();
                } else {
                    alert("Senha incorreta!");
                }
            };

            const btnBaixar = document.getElementById('btnModalBaixar');
            btnBaixar.onclick = (e) => { e.preventDefault(); window.open(url, '_blank'); };

            const listaComentarios = document.getElementById('listaComentariosModal');
            listaComentarios.innerHTML = "<li class='comentario-item'>Carregando comentários...</li>";

            onSnapshot(query(collection(db, "eventos/" + EVENTO_ID + "/postagens/" + id + "/comentarios"), orderBy("data_envio", "asc")), (snapComent) => {
                listaComentarios.innerHTML = "";
                if(snapComent.empty) {
                    listaComentarios.innerHTML = "<li class='comentario-item' style='color:#777;'>Nenhum comentário ainda. Seja o primeiro!</li>";
                    return;
                }
                snapComent.forEach(cDoc => {
                    const cData = cDoc.data();
                    const li = document.createElement('li');
                    li.className = 'comentario-item';
                    li.innerHTML = `<strong style="color:var(--cor-destaque)">${cData.nome}:</strong> ${cData.texto}`;
                    listaComentarios.appendChild(li);
                });
                listaComentarios.scrollTop = listaComentarios.scrollHeight;
            });

            document.getElementById('btnEnviarComentarioModal').onclick = async () => {
                const nomeInput = document.getElementById('inputNomeConvidado');
                const textoInput = document.getElementById('inputTextoComentario');
                const nomeVal = nomeInput.value.trim();
                const textoVal = textoInput.value.trim();

                if(!nomeVal || !textoVal) {
                    alert("Preencha seu nome e o comentário!");
                    return;
                }

                localStorage.setItem('nomeConvidado', nomeVal);
                await addDoc(collection(db, "eventos/" + EVENTO_ID + "/postagens/" + id + "/comentarios"), {
                    nome: nomeVal,
                    texto: textoVal,
                    data_envio: serverTimestamp()
                });
                await updateDoc(doc(db, "eventos/" + EVENTO_ID + "/postagens", id), {
                    total_comentarios: increment(1)
                });
                textoInput.value = "";
            };

            if(localStorage.getItem('nomeConvidado')) {
                document.getElementById('inputNomeConvidado').value = localStorage.getItem('nomeConvidado');
            }

            document.getElementById('modalFoto').style.display = 'flex';
        }

        window.fecharModal = () => {
            document.getElementById('modalFoto').style.display = 'none';
            document.getElementById('modalMediaWrapper').innerHTML = "";
        };

        window.toggleLike = (id) => {
            updateDoc(doc(db, "eventos/" + EVENTO_ID + "/postagens", id), { curtidas: increment(1) });
        };

        let telaoTimer = null;
        window.openTelao = () => {
            document.getElementById('telaoModal').style.display = 'flex';
            startTelaoSlideshow();
        }
        window.closeTelao = () => {
            document.getElementById('telaoModal').style.display = 'none';
            if (telaoTimer) clearTimeout(telaoTimer);
        }

        function startTelaoSlideshow() {
            const container = document.getElementById('telaoMediaContainer');
            let all = [...appData.photos, ...appData.videos];
            
            if(all.length === 0) {
                container.innerHTML = "<h3 style='color:#aaa;'>Aguardando mídias para o Telão...</h3>";
                telaoTimer = setTimeout(startTelaoSlideshow, 3000);
                return;
            }

            let idx = 0;
            function mostrarProximo() {
                if (document.getElementById('telaoModal').style.display !== 'flex') return;
                
                let currentList = [...appData.photos, ...appData.videos];
                if(currentList.length === 0) {
                    container.innerHTML = "<h3 style='color:#aaa;'>Aguardando mídias para o Telão...</h3>";
                    telaoTimer = setTimeout(mostrarProximo, 3000);
                    return;
                }

                idx = idx % currentList.length;
                const item = currentList[idx];
                idx++;

                if (item.tipo === 'video') {
                    container.innerHTML = `<video src="${item.url}" autoplay controls playsinline style="max-width:100%; max-height:80vh; object-fit:contain; border-radius:8px; background:#000;"></video>`;
                    const vidEl = container.querySelector('video');
                    vidEl.onended = () => { mostrarProximo(); };
                    vidEl.onerror = () => { telaoTimer = setTimeout(mostrarProximo, 3000); };
                } else {
                    container.innerHTML = `<img src="${item.url}" style="max-width:100%; max-height:80vh; object-fit:contain; border-radius:8px;">`;
                    telaoTimer = setTimeout(mostrarProximo, 5000);
                }
            }
            mostrarProximo();
        }

        document.getElementById('btnVideoLink').onclick = () => {
            if(LINK_VIDEO_EXTERNO) window.open(LINK_VIDEO_EXTERNO, "_blank");
            else alert("Link externo não configurado.");
        };

    } catch(e) { console.error("Erro:", e); }
</script>
</body>
</html>
