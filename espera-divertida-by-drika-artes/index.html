<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Espera Divertida - Timer do Patinho</title>
  <style>
    :root {
      --bg-color: #F0F9FF;
      --card-bg: #FFFFFF;
      --primary: #0284C7;
      --water-color: #38BDF8;
      --water-deep: #0284C7;
      --text: #1E293B;
      --text-muted: #64748B;
      --card-border: #E0F2FE;
    }

    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      padding: 16px;
      max-width: 480px;
      margin: 0 auto;
      user-select: none;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .app-header {
      text-align: center;
      margin-top: 4px;
      margin-bottom: 12px;
    }

    .app-title {
      font-size: 26px;
      font-weight: 800;
      color: #0369A1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .app-subtitle {
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 600;
      margin-top: 2px;
    }

    /* Banheira Central */
    .timer-container {
      background: var(--card-bg);
      border-radius: 28px;
      padding: 22px 18px;
      box-shadow: 0 10px 25px rgba(2, 132, 199, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 14px;
      border: 3px solid var(--card-border);
      position: relative;
    }

    .pond-wrapper {
      position: relative;
      width: 250px;
      height: 250px;
      border-radius: 50%;
      background: #E0F2FE;
      border: 10px solid #BAE6FD;
      overflow: hidden;
      box-shadow: inset 0 6px 14px rgba(0,0,0,0.06);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .water-fill {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, var(--water-color) 0%, var(--water-deep) 100%);
      transition: height 0.6s linear;
      border-top: 4px solid #7DD3FC;
    }

    /* Patinho Amarelinho */
    .duck-float {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      transition: bottom 0.6s linear, transform 0.3s ease;
      bottom: calc(100% - 70px);
      z-index: 10;
      cursor: pointer;
    }

    .duck-svg {
      width: 78px;
      height: 78px;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.15));
      animation: bobbing 2.2s infinite ease-in-out;
    }

    @keyframes bobbing {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-5px) rotate(3deg); }
    }

    /* Animação comemorativa do Patinho */
    .celebrating .duck-svg {
      animation: duckDance 0.6s infinite alternate ease-in-out !important;
    }

    @keyframes duckDance {
      0% { transform: translateY(0px) scale(1) rotate(-8deg); }
      100% { transform: translateY(-22px) scale(1.15) rotate(8deg); }
    }

    /* Bolhas de Sabão subindo */
    .bubble {
      position: absolute;
      bottom: -20px;
      background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.9), rgba(125, 211, 252, 0.4));
      border: 2px solid rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      opacity: 0.85;
      animation: rise 2.5s infinite ease-in;
      pointer-events: none;
      z-index: 15;
    }

    @keyframes rise {
      0% {
        transform: translateY(0) scale(0.5);
        opacity: 0.9;
      }
      100% {
        transform: translateY(-280px) scale(1.2);
        opacity: 0;
      }
    }

    .timer-digits {
      font-size: 40px;
      font-weight: 800;
      color: #0369A1;
      margin-top: 14px;
      letter-spacing: 1px;
    }

    .timer-label {
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 600;
      margin-top: 2px;
      text-align: center;
      min-height: 20px;
    }

    /* Ajuste Manual do Tempo */
    .time-adjust-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 12px;
      background: var(--card-bg);
      padding: 10px 14px;
      border-radius: 18px;
      border: 2px solid var(--card-border);
    }

    .btn-step {
      background: #E0F2FE;
      color: #0369A1;
      border: none;
      font-size: 16px;
      font-weight: 800;
      padding: 8px 14px;
      border-radius: 12px;
      cursor: pointer;
    }

    .time-input-group {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 700;
      color: #475569;
    }

    .custom-min-input {
      width: 58px;
      padding: 6px 8px;
      border: 2px solid #BAE6FD;
      border-radius: 10px;
      text-align: center;
      font-size: 17px;
      font-weight: 800;
      color: #0369A1;
      outline: none;
    }

    /* Botões Rápidos */
    .presets-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
    }

    .preset-btn {
      flex: 1;
      background: #E0F2FE;
      border: 2px solid #BAE6FD;
      color: #0369A1;
      padding: 10px 2px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }

    .preset-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    /* Botões de Controle Principal */
    .action-row {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }

    .btn-main {
      flex: 2;
      background: #22C55E;
      color: white;
      border: none;
      padding: 15px;
      border-radius: 16px;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(34, 197, 94, 0.25);
    }

    .btn-main.running {
      background: #F59E0B;
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.25);
    }

    .btn-reset {
      flex: 1;
      background: #E2E8F0;
      color: #475569;
      border: none;
      padding: 15px;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    footer {
      margin-top: auto;
      text-align: center;
      padding: 14px;
      font-size: 13px;
      color: #64748B;
      font-weight: 600;
    }

    .footer-brand {
      color: #0284C7;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="app-header">
    <div class="app-title">🐥 Espera Divertida</div>
    <div class="app-subtitle">Acompanhe a banheira do patinho!</div>
  </div>

  <div class="timer-container" id="timerBox">
    <div class="pond-wrapper" id="pond">
      <div class="water-fill" id="waterLevel"></div>
      
      <!-- Patinho Amarelinho -->
      <div class="duck-float" id="duckFloat" onclick="quackSound()" title="Toque no patinho!">
        <svg class="duck-svg" viewBox="0 0 100 100">
          <ellipse cx="50" cy="62" rx="30" ry="22" fill="#FACC15" />
          <path d="M75 58 Q85 52 82 44 Q70 48 68 54 Z" fill="#FACC15" />
          <circle cx="34" cy="40" r="18" fill="#FACC15" />
          <circle cx="28" cy="36" r="3.5" fill="#1E293B" />
          <circle cx="27" cy="35" r="1" fill="#FFFFFF" />
          <path d="M20 40 Q8 42 16 48 Q24 48 25 45 Z" fill="#FB923C" />
          <ellipse cx="54" cy="62" rx="14" ry="9" fill="#EAB308" />
        </svg>
      </div>
    </div>

    <div class="timer-digits" id="timeDisplay">05:00</div>
    <div class="timer-label" id="statusLabel">Toque no patinho para ouvi-lo!</div>
  </div>

  <!-- Ajuste Manual Fino de Minutos -->
  <div class="time-adjust-row">
    <button class="btn-step" onclick="adjustTime(-1)">- 1 min</button>
    <div class="time-input-group">
      <span>Tempo:</span>
      <input type="number" id="customInput" class="custom-min-input" min="1" max="120" value="5" onchange="manualSetTime()">
      <span>min</span>
    </div>
    <button class="btn-step" onclick="adjustTime(+1)">+ 1 min</button>
  </div>

  <!-- Atalhos Rápidos -->
  <div class="presets-bar">
    <button class="preset-btn" onclick="applyPreset(1)">1 min</button>
    <button class="preset-btn" onclick="applyPreset(2)">2 min</button>
    <button class="preset-btn active" onclick="applyPreset(5)">5 min</button>
    <button class="preset-btn" onclick="applyPreset(10)">10 min</button>
    <button class="preset-btn" onclick="applyPreset(15)">15 min</button>
  </div>

  <!-- Botões Começar / Pausar / Reiniciar -->
  <div class="action-row">
    <button class="btn-main" id="btnPlay" onclick="toggleTimer()">Começar</button>
    <button class="btn-reset" onclick="resetTimer()">Reiniciar</button>
  </div>

  <footer>
    Produzido com carinho por <span class="footer-brand">Drika Artes e Retrospectivas</span>
  </footer>

  <script>
    let totalSeconds = 300;
    let remainingSeconds = 300;
    let timerInterval = null;
    let isRunning = false;
    let bubbleInterval = null;

    function updateDisplay() {
      const minutes = Math.floor(remainingSeconds / 60);
      const seconds = remainingSeconds % 60;
      document.getElementById('timeDisplay').innerText = 
        `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

      const percentage = (remainingSeconds / totalSeconds) * 100;
      const waterEl = document.getElementById('waterLevel');
      const duckEl = document.getElementById('duckFloat');

      waterEl.style.height = `${percentage}%`;

      const bottomPos = Math.max(14, (percentage * 250 / 100) - 42);
      duckEl.style.bottom = `${bottomPos}px`;
    }

    function toggleTimer() {
      if (isRunning) {
        pauseTimer();
      } else {
        startTimer();
      }
    }

    function startTimer() {
      stopCelebration();
      if (remainingSeconds <= 0) resetTimer();
      isRunning = true;
      document.getElementById('btnPlay').innerText = "Pausar";
      document.getElementById('btnPlay').classList.add('running');
      document.getElementById('statusLabel').innerText = "A água está baixando devagar...";

      speak("Tempo iniciado! Olhe o patinho na banheira.");

      timerInterval = setInterval(() => {
        if (remainingSeconds > 0) {
          remainingSeconds--;
          updateDisplay();
        } else {
          finishTimer();
        }
      }, 1000);
    }

    function pauseTimer() {
      isRunning = false;
      clearInterval(timerInterval);
      document.getElementById('btnPlay').innerText = "Continuar";
      document.getElementById('btnPlay').classList.remove('running');
      document.getElementById('statusLabel').innerText = "Em pausa";
    }

    function resetTimer() {
      pauseTimer();
      stopCelebration();
      remainingSeconds = totalSeconds;
      document.getElementById('btnPlay').innerText = "Começar";
      document.getElementById('statusLabel').innerText = "Toque no patinho para ouvi-lo!";
      updateDisplay();
    }

    function adjustTime(diffMinutes) {
      if (isRunning) return;
      let currentMins = Math.round(totalSeconds / 60) + diffMinutes;
      if (currentMins < 1) currentMins = 1;
      if (currentMins > 120) currentMins = 120;
      setMinutes(currentMins);
    }

    function manualSetTime() {
      if (isRunning) return;
      let mins = parseInt(document.getElementById('customInput').value);
      if (isNaN(mins) || mins < 1) mins = 1;
      if (mins > 120) mins = 120;
      setMinutes(mins);
    }

    function applyPreset(mins) {
      if (isRunning) return;
      setMinutes(mins);
    }

    function setMinutes(mins) {
      totalSeconds = mins * 60;
      remainingSeconds = totalSeconds;
      document.getElementById('customInput').value = mins;

      document.querySelectorAll('.preset-btn').forEach(btn => {
        btn.classList.toggle('active', btn.innerText === `${mins} min`);
      });

      resetTimer();
    }

    function finishTimer() {
      pauseTimer();
      startCelebration();
      document.getElementById('statusLabel').innerText = "🎉 O tempo acabou! Muito bem!";
      speak("O tempo acabou! Muito bem! O patinho está muito feliz!");
    }

    // Comemoração: Dança do patinho + Bolhas de sabão
    function startCelebration() {
      document.getElementById('duckFloat').classList.add('celebrating');
      playVictoryMusic();

      const pond = document.getElementById('pond');
      bubbleInterval = setInterval(() => {
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        const size = Math.floor(Math.random() * 26) + 16;
        bubble.style.width = `${size}px`;
        bubble.style.height = `${size}px`;
        bubble.style.left = `${Math.floor(Math.random() * 200) + 25}px`;
        bubble.style.animationDuration = `${(Math.random() * 1.2 + 1.8)}s`;
        pond.appendChild(bubble);

        setTimeout(() => bubble.remove(), 2500);
      }, 250);
    }

    function stopCelebration() {
      document.getElementById('duckFloat').classList.remove('celebrating');
      if (bubbleInterval) clearInterval(bubbleInterval);
      document.querySelectorAll('.bubble').forEach(b => b.remove());
    }

    // Melodia de celebração harmoniosa com quack alegre
    function playVictoryMusic() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const melody = [
          { f: 523.25, d: 0.15 }, // C5
          { f: 659.25, d: 0.15 }, // E5
          { f: 783.99, d: 0.15 }, // G5
          { f: 1046.50, d: 0.35 } // C6
        ];

        melody.forEach((note, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.frequency.value = note.f;
          const start = ctx.currentTime + (i * 0.18);
          gain.gain.setValueAtTime(0.08, start);
          gain.gain.exponentialRampToValueAtTime(0.001, start + note.d + 0.3);
          osc.start(start);
          osc.stop(start + note.d + 0.3);
        });

        // Dois quacks alegres ao final
        setTimeout(() => quackSound(), 800);
        setTimeout(() => quackSound(), 1100);
      } catch(e) {}
    }

    function quackSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.setValueAtTime(360, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.18);
        gain.gain.setValueAtTime(0.12, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.22);
        osc.start();
        osc.stop(ctx.currentTime + 0.22);
      } catch(e) {}
    }

    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'pt-BR';
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
      }
    }

    updateDisplay();
  </script>
</body>
</html>
