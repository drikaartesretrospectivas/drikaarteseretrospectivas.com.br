<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Espera Divertida - Timer do Patinho</title>
  <style>
    :root {
      --bg-color: #F0F9FF;
      --card-bg: #FFFFFF;
      --primary: #0284C7;
      --duck-yellow: #FACC15;
      --duck-beak: #FB923C;
      --water-color: #38BDF8;
      --water-deep: #0284C7;
      --text: #1E293B;
      --text-muted: #64748B;
      --card-border: #E0F2FE;
    }

    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      padding: 16px;
      max-width: 480px;
      margin: 0 auto;
      user-select: none;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Topo do App */
    .app-header {
      text-align: center;
      margin-top: 8px;
      margin-bottom: 16px;
    }

    .app-title {
      font-size: 26px;
      font-weight: 800;
      color: #0369A1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .app-subtitle {
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 600;
      margin-top: 4px;
    }

    /* Cartão da Banheira Central */
    .timer-container {
      background: var(--card-bg);
      border-radius: 28px;
      padding: 26px 20px;
      box-shadow: 0 10px 25px rgba(2, 132, 199, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 20px;
      border: 3px solid var(--card-border);
    }

    /* Banheira Redonda com Água */
    .pond-wrapper {
      position: relative;
      width: 250px;
      height: 250px;
      border-radius: 50%;
      background: #E0F2FE;
      border: 10px solid #BAE6FD;
      overflow: hidden;
      box-shadow: inset 0 6px 14px rgba(0,0,0,0.06);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .water-fill {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, var(--water-color) 0%, var(--water-deep) 100%);
      transition: height 0.6s linear;
      border-top: 4px solid #7DD3FC;
    }

    /* Patinho Amarelinho Flutuando */
    .duck-float {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      transition: bottom 0.6s linear;
      bottom: calc(100% - 70px);
      z-index: 10;
      cursor: pointer;
    }

    .duck-svg {
      width: 76px;
      height: 76px;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.15));
      animation: bobbing 2.2s infinite ease-in-out;
    }

    @keyframes bobbing {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-6px) rotate(3deg); }
    }

    .timer-digits {
      font-size: 38px;
      font-weight: 800;
      color: #0369A1;
      margin-top: 18px;
      letter-spacing: 1px;
    }

    .timer-label {
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 600;
      margin-top: 4px;
    }

    /* Botões Rápidos de Minutos */
    .presets-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .preset-btn {
      flex: 1;
      background: #E0F2FE;
      border: 2px solid #BAE6FD;
      color: #0369A1;
      padding: 12px 4px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .preset-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    /* Controles de Ação */
    .action-row {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }

    .btn-main {
      flex: 2;
      background: #22C55E;
      color: white;
      border: none;
      padding: 16px;
      border-radius: 16px;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(34, 197, 94, 0.25);
      transition: background 0.2s;
    }

    .btn-main.running {
      background: #F59E0B;
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.25);
    }

    .btn-reset {
      flex: 1;
      background: #E2E8F0;
      color: #475569;
      border: none;
      padding: 16px;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Rodapé com Assinatura */
    footer {
      margin-top: auto;
      text-align: center;
      padding: 16px;
      font-size: 13px;
      color: #64748B;
      font-weight: 600;
    }

    .footer-brand {
      color: #0284C7;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="app-header">
    <div class="app-title">🐥 Espera Divertida</div>
    <div class="app-subtitle">Acompanhe a banheira do patinho!</div>
  </div>

  <!-- Banheira com Patinho -->
  <div class="timer-container">
    <div class="pond-wrapper">
      <div class="water-fill" id="waterLevel"></div>
      
      <!-- Patinho Amarelinho -->
      <div class="duck-float" id="duckFloat" onclick="quackSound()" title="Toque no patinho!">
        <svg class="duck-svg" viewBox="0 0 100 100">
          <ellipse cx="50" cy="62" rx="30" ry="22" fill="#FACC15" />
          <path d="M75 58 Q85 52 82 44 Q70 48 68 54 Z" fill="#FACC15" />
          <circle cx="34" cy="40" r="18" fill="#FACC15" />
          <circle cx="28" cy="36" r="3.5" fill="#1E293B" />
          <circle cx="27" cy="35" r="1" fill="#FFFFFF" />
          <path d="M20 40 Q8 42 16 48 Q24 48 25 45 Z" fill="#FB923C" />
          <ellipse cx="54" cy="62" rx="14" ry="9" fill="#EAB308" />
        </svg>
      </div>
    </div>

    <div class="timer-digits" id="timeDisplay">05:00</div>
    <div class="timer-label" id="statusLabel">Toque no patinho para ouvi-lo!</div>
  </div>

  <!-- Seleção Rápida de Minutos -->
  <div class="presets-bar">
    <button class="preset-btn" onclick="setPreset(1)">1 min</button>
    <button class="preset-btn" onclick="setPreset(2)">2 min</button>
    <button class="preset-btn active" onclick="setPreset(5)">5 min</button>
    <button class="preset-btn" onclick="setPreset(10)">10 min</button>
  </div>

  <!-- Botões Começar / Pausar / Reiniciar -->
  <div class="action-row">
    <button class="btn-main" id="btnPlay" onclick="toggleTimer()">Começar</button>
    <button class="btn-reset" onclick="resetTimer()">Reiniciar</button>
  </div>

  <footer>
    Produzido com carinho por <span class="footer-brand">Drika Artes e Retrospectivas</span>
  </footer>

  <script>
    let totalSeconds = 300; // 5 minutos padrão
    let remainingSeconds = 300;
    let timerInterval = null;
    let isRunning = false;

    function updateDisplay() {
      const minutes = Math.floor(remainingSeconds / 60);
      const seconds = remainingSeconds % 60;
      document.getElementById('timeDisplay').innerText = 
        `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

      // Altura da água conforme o tempo restante
      const percentage = (remainingSeconds / totalSeconds) * 100;
      const waterEl = document.getElementById('waterLevel');
      const duckEl = document.getElementById('duckFloat');

      waterEl.style.height = `${percentage}%`;

      // Altura do patinho para boiar sempre no topo da água
      const bottomPos = Math.max(14, (percentage * 250 / 100) - 42);
      duckEl.style.bottom = `${bottomPos}px`;
    }

    function toggleTimer() {
      if (isRunning) {
        pauseTimer();
      } else {
        startTimer();
      }
    }

    function startTimer() {
      if (remainingSeconds <= 0) resetTimer();
      isRunning = true;
      document.getElementById('btnPlay').innerText = "Pausar";
      document.getElementById('btnPlay').classList.add('running');
      document.getElementById('statusLabel').innerText = "A água está baixando devagar...";

      speak("Tempo iniciado! Olhe o patinho na banheira.");

      timerInterval = setInterval(() => {
        if (remainingSeconds > 0) {
          remainingSeconds--;
          updateDisplay();
        } else {
          finishTimer();
        }
      }, 1000);
    }

    function pauseTimer() {
      isRunning = false;
      clearInterval(timerInterval);
      document.getElementById('btnPlay').innerText = "Continuar";
      document.getElementById('btnPlay').classList.remove('running');
      document.getElementById('statusLabel').innerText = "Em pausa";
    }

    function resetTimer() {
      pauseTimer();
      remainingSeconds = totalSeconds;
      document.getElementById('btnPlay').innerText = "Começar";
      document.getElementById('statusLabel').innerText = "Toque no patinho para ouvi-lo!";
      updateDisplay();
    }

    function setPreset(mins) {
      document.querySelectorAll('.preset-btn').forEach(btn => {
        btn.classList.toggle('active', btn.innerText.includes(`${mins} min`));
      });
      totalSeconds = mins * 60;
      resetTimer();
    }

    function finishTimer() {
      pauseTimer();
      playGentleBell();
      document.getElementById('statusLabel').innerText = "Tempo acabou! Muito bem! 🎉";
      speak("O tempo acabou! Muito bem!");
    }

    // Som de Quá-quá suave ao tocar no patinho
    function quackSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.setValueAtTime(340, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(190, ctx.currentTime + 0.18);
        gain.gain.setValueAtTime(0.12, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.22);
        osc.start();
        osc.stop(ctx.currentTime + 0.22);
      } catch(e) {}
    }

    // Sons harmônicos suaves ao finalizar o tempo (sem susto)
    function playGentleBell() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const notes = [523.25, 659.25, 783.99, 1046.50]; // Dó, Mi, Sol, Dó agudo
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.frequency.value = freq;
          const start = ctx.currentTime + (idx * 0.16);
          gain.gain.setValueAtTime(0.07, start);
          gain.gain.exponentialRampToValueAtTime(0.001, start + 0.6);
          osc.start(start);
          osc.stop(start + 0.6);
        });
      } catch(e) {}
    }

    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'pt-BR';
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
      }
    }

    // Inicialização da tela
    updateDisplay();
  </script>
</body>
</html>
